name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Restore
        uses: oznetmaster/BuildAutomation@c0a215e202dc1e05a37707720ab12032be610518
        with:
          task: ci-build-restore
      - name: Build
        uses: oznetmaster/BuildAutomation@c0a215e202dc1e05a37707720ab12032be610518
        with:
          task: ci-build-build
      - name: Run offline NUnit tests on both target frameworks
        uses: oznetmaster/BuildAutomation@c0a215e202dc1e05a37707720ab12032be610518
        with:
          task: ci-build-run-offline-nunit-tests-on-both-target-frameworks
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nunit-test-results
          path: TestResults/*.trx
          if-no-files-found: warn

      - name: Pack library
        uses: oznetmaster/BuildAutomation@c0a215e202dc1e05a37707720ab12032be610518
        with:
          task: ci-build-pack-library
        env:
          BUILD_INPUT_0: ${{ github.workspace }}
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ${{ github.workspace }}/artifacts/*.nupkg
          if-no-files-found: error