name: Publish Docs
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-docs:
    runs-on: windows-latest
    env:
      DOCFX_CONFIG: docfx_project/docfx.json
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Build, verify and retain standard documentation
      uses: oznetmaster/BuildAutomation/.github/actions/documentation-build@c650afeb23c584d68580440ef0f7baaf737cdfd0
      with:
        site: .\docfx-site
        configure-pages: 'true'
  deploy-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-docs
    steps:
    - name: Deploy documentation
      id: deployment
      uses: oznetmaster/BuildAutomation/.github/actions/documentation-deploy@c650afeb23c584d68580440ef0f7baaf737cdfd0
      with:
        attempts: '1'
'on':
  push:
    branches:
    - master
  workflow_dispatch: null
